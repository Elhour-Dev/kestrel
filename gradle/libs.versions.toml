[versions]
agp = "9.5.0"
kotlin = "2.4.21"
# Updated automatically by .github/workflows/daily-update.yml
newpipe-extractor = "v0.27.1"
desugar = "2.1.5"
compose-bom = "2026.09.00"
icons = "1.7.8"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
core = "1.19.1"
webkit = "1.18.0"
documentfile = "1.1.0"
media3 = "1.10.1"
coil = "3.6.3"
okhttp = "5.5.1"
