name: CI

# Every push and pull request: build, lint and unit tests. Never publishes anything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK parts
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v5

      - name: Build, lint, unit tests
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
